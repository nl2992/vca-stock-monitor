[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vca-stock-monitor"
version = "1.0.0"
description = "Read-only availability monitor for one Van Cleef & Arpels product page"
requires-python = ">=3.12"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
