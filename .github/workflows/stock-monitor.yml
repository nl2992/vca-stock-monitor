name: VCA stock monitor

# Read-only check of VCARD35600 every 15 minutes, running entirely on GitHub with no
# credentials, no secrets and no external services. When the bracelet becomes
# purchasable the job opens an issue mentioning the owner and then fails, so
# GitHub's own notification emails do the alerting.
on:
  schedule:
    # Roughly every 15 minutes, deliberately NOT on :00/:15/:30/:45. Those are
    # the most contended minutes on the platform and GitHub drops scheduled
    # runs under load; "*/15" produced no runs at all across eight slots.
    # Odd offsets are the documented mitigation. Still best-effort: expect
    # lateness and the occasional skip.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      simulate:
        description: "Force a classification to test the alert path"
        type: choice
        required: false
        default: "none"
        options:
          - none
          - available
          - inconclusive

permissions:
  contents: read
  issues: write

concurrency:
  group: vca-stock-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: src

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      # continue-on-error so a probe failure still reaches the decision step,
      # which turns it into INCONCLUSIVE rather than an unexplained red run.
      - name: Check the product page
        id: probe
        continue-on-error: true
        run: python scripts/browser_probe.py --json-out probe-evidence.json

      - name: Decide
        id: decide
        run: |
          python scripts/decide.py \
            --evidence probe-evidence.json \
            --body-out issue-body.md \
            --simulate "${{ github.event.inputs.simulate || 'none' }}"

      # One open issue at a time is the duplicate guard: while the bracelet
      # stays in stock, later runs find it and do not notify again.
      - name: Open an issue
        if: steps.decide.outputs.state == 'AVAILABLE'
        env:
          GH_TOKEN: ${{ github.token }}
          SIMULATED: ${{ steps.decide.outputs.simulated }}
        run: |
          set -euo pipefail
          LABEL=vca-in-stock
          gh label create "$LABEL" --color B60205 \
            --description "VCARD35600 appears purchasable online" 2>/dev/null || true

          EXISTING=$(gh issue list --label "$LABEL" --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "::warning::Still AVAILABLE; issue #$EXISTING is already open, not re-notifying."
            exit 0
          fi

          TITLE="VCA Alhambra bracelet AVAILABLE - Vintage Alhambra 5 motifs Tiger Eye"
          if [ "$SIMULATED" = "true" ]; then
            TITLE="[TEST] $TITLE"
          fi
          gh issue create --title "$TITLE" --label "$LABEL" --body-file issue-body.md

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: probe-evidence.json
          if-no-files-found: ignore
          retention-days: 30

      # Deliberately last, and deliberately red. A failed run is what makes
      # GitHub email you, so "in stock" and "the monitor is broken" both reach
      # you, and neither can masquerade as "not in stock".
      - name: Fail the run so GitHub sends a notification
        if: steps.decide.outputs.state != 'NOT_AVAILABLE'
        run: |
          echo "::error::Stock check result: ${{ steps.decide.outputs.state }}"
          echo "No purchase was attempted."
          exit 1
